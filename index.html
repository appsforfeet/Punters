<script>
(() => {
  const KEY = "punters_club_tracker_v2";

  const $ = (id) => document.getElementById(id);

  const fmt = (n) => {
    const x = Number(n || 0);
    return x.toLocaleString("en-AU", { style:"currency", currency:"AUD" });
  };

  const todayISO = () => {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(Date.now() - tz).toISOString().slice(0,10);
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY) || localStorage.getItem("punters_club_tracker_v1");
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  const state = load() ?? {
    members: ["J"],
    weeklyDefault: 25,
    tx: [],     // ledger transactions
    bets: []    // pending/settled bets
  };

  // Backwards compatibility if old save didn’t have bets
  if (!Array.isArray(state.bets)) state.bets = [];

  // --- init UI ---
  $("date").value = todayISO();
  $("weeklyDefault").value = state.weeklyDefault ?? 25;

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function uid() {
    return Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function parseAmount(value) {
    const cleaned = String(value || "").replace(/[^0-9.]/g, "");
    const n = Number(cleaned);
    if (!isFinite(n) || n <= 0) return null;
    return n;
  }

  function typeTag(t) {
    const map = {
      deposit: ["Deposit", "dep"],
      bet: ["Bet", "bet"],
      win: ["Win", "win"],
      loss: ["Loss", "loss"],
      withdrawal: ["Withdrawal", "wd"]
    };
    const [label, cls] = map[t] || [t, ""];
    return `<span class="tag ${cls}">${label}</span>`;
  }

  // IMPORTANT: loss does NOT change balance (prevents double counting)
  function signedAmount(tx) {
    const a = Number(tx.amount || 0);
    if (tx.type === "deposit" || tx.type === "win") return +a;
    if (tx.type === "loss") return 0;
    return -a; // bet, withdrawal
  }

  function computeRunning() {
    const sorted = [...state.tx].sort((a,b) =>
      (a.date||"").localeCompare(b.date||"") || (a.id||"").localeCompare(b.id||"")
    );
    let bal = 0;
    const withBal = sorted.map(t => {
      bal += signedAmount(t);
      return {...t, running: bal};
    });
    return withBal;
  }

  function rebuildMemberSelect() {
    const sel = $("member");
    sel.innerHTML = `<option value="">(none)</option>` + state.members
      .map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  }

  function renderMembers() {
    const box = $("membersList");
    box.innerHTML = "";
    state.members.forEach((m, idx) => {
      const div = document.createElement("div");
      div.className = "row";
      div.style.margin = "8px 0";
      div.innerHTML = `
        <div class="pill" style="flex:1; justify-content: space-between;">
          <div><b>${escapeHtml(m)}</b></div>
          <button class="btn2" data-del="${idx}" title="Remove member">Remove</button>
        </div>
      `;
      box.appendChild(div);
    });

    box.querySelectorAll("button[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.getAttribute("data-del"));
        const name = state.members[i];
        if (!confirm(`Remove member "${name}"? (Does not delete past ledger entries)`)) return;
        state.members.splice(i,1);
        if (state.members.length === 0) state.members.push("J");
        save();
        renderAll();
      });
    });
  }

  function renderLedger() {
    const tbody = $("ledger");
    const q = ($("search").value || "").trim().toLowerCase();
    const ft = $("filterType").value;

    const rows = computeRunning();
    const filtered = rows.filter(r => {
      if (ft !== "all" && r.type !== ft) return false;
      if (!q) return true;
      const blob = `${r.date} ${r.type} ${r.member||""} ${r.notes||""} ${r.amount}`.toLowerCase();
      return blob.includes(q);
    }).sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.id||"").localeCompare(a.id||""));

    tbody.innerHTML = filtered.map(r => {
      const amt = signedAmount(r);
      const cls = amt >= 0 ? "good" : "bad";
      const showAmt = (r.type === "loss") ? fmt(0) : fmt(Math.abs(amt));
      const suffix = (r.type === "loss") ? "" : (amt < 0 ? " -" : " +");

      return `
        <tr>
          <td>${escapeHtml(r.date || "")}</td>
          <td>${typeTag(r.type)}</td>
          <td>${escapeHtml(r.member || "")}</td>
          <td>${escapeHtml(r.notes || "")}</td>
          <td class="right ${cls}">${showAmt}${suffix}</td>
          <td class="right">${fmt(r.running)}</td>
          <td class="right"><button class="btn2" data-x="${r.id}">Delete</button></td>
        </tr>
      `;
    }).join("");

    tbody.querySelectorAll("button[data-x]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-x");
        const i = state.tx.findIndex(t => t.id === id);
        if (i === -1) return;
        if (!confirm("Delete this transaction?")) return;
        state.tx.splice(i, 1);
        save();
        renderAll();
      });
    });
  }

  // ---- Pending bets ----
  function renderPendingBets() {
    const tbody = $("pendingBets");
    const pending = state.bets.filter(b => b.status === "pending")
      .sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.id||"").localeCompare(a.id||""));

    if (pending.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="mini muted">No pending bets.</td></tr>`;
      return;
    }

    tbody.innerHTML = pending.map(b => `
      <tr>
        <td>${escapeHtml(b.date || "")}</td>
        <td>${fmt(b.stake)}</td>
        <td>${Number(b.odds).toFixed(2)}</td>
        <td>${fmt(b.projected)}</td>
        <td>${escapeHtml(b.notes || "")}</td>
        <td class="right">
          <button class="btn2" data-win="${b.id}">WIN</button>
          <button class="btn2" data-loss="${b.id}">LOSS</button>
        </td>
      </tr>
    `).join("");

    tbody.querySelectorAll("button[data-win]").forEach(btn => {
      btn.addEventListener("click", () => settleBet(btn.getAttribute("data-win"), "win"));
    });
    tbody.querySelectorAll("button[data-loss]").forEach(btn => {
      btn.addEventListener("click", () => settleBet(btn.getAttribute("data-loss"), "loss"));
    });
  }

  function settleBet(betId, outcome) {
    const bet = state.bets.find(b => b.id === betId);
    if (!bet || bet.status !== "pending") return;

    if (!confirm(`Settle this bet as ${outcome.toUpperCase()}?`)) return;

    bet.status = outcome === "win" ? "won" : "lost";
    bet.settledAt = todayISO();

    // Create ledger entries for settlement:
    // - WIN adds projected return into balance
    // - LOSS adds a $0 loss marker (no balance change)
    if (outcome === "win") {
      state.tx.push({
        id: uid(),
        type: "win",
        date: bet.date || todayISO(),
        amount: bet.projected,
        member: bet.member || "",
        notes: `WIN settled: ${bet.notes || "Bet"} (stake ${bet.stake}, odds ${bet.odds})`
      });
    } else {
      state.tx.push({
        id: uid(),
        type: "loss",
        date: bet.date || todayISO(),
        amount: 0,
        member: bet.member || "",
        notes: `LOSS settled: ${bet.notes || "Bet"} (stake ${bet.stake}, odds ${bet.odds})`
      });
    }

    save();
    renderAll();
  }

  function renderSummary() {
    const tx = state.tx;

    const dep = tx.filter(t=>t.type==="deposit").reduce((s,t)=>s+Number(t.amount||0),0);
    const wins = tx.filter(t=>t.type==="win").reduce((s,t)=>s+Number(t.amount||0),0);
    const bets = tx.filter(t=>t.type==="bet").reduce((s,t)=>s+Number(t.amount||0),0);
    const wds = tx.filter(t=>t.type==="withdrawal").reduce((s,t)=>s+Number(t.amount||0),0);

    const bal = computeRunning().slice(-1)[0]?.running ?? 0;
    const netPL = bal - dep + wds;

    $("balance").textContent = fmt(bal);
    $("deposits").textContent = fmt(dep);
    $("net").textContent = fmt(netPL);
    $("net").className = "big " + (netPL >= 0 ? "good" : "bad");

    // pending bets stats
    const pending = state.bets.filter(b=>b.status==="pending");
    const pendingStake = pending.reduce((s,b)=>s + Number(b.stake||0), 0);
    const wonCount = state.bets.filter(b=>b.status==="won").length;
    const lostCount = state.bets.filter(b=>b.status==="lost").length;

    // per-member deposits
    const perMember = {};
    tx.filter(t=>t.type==="deposit" && t.member).forEach(t => {
      perMember[t.member] = (perMember[t.member]||0) + Number(t.amount||0);
    });

    const lines = [];
    lines.push(`<div class="pill" style="width:100%; justify-content:space-between;"><span class="muted">Deposits</span><b>${fmt(dep)}</b></div>`);
    lines.push(`<div class="pill" style="width:100%; justify-content:space-between;"><span class="muted">Bets placed (stake)</span><b>${fmt(bets)}</b></div>`);
    lines.push(`<div class="pill" style="width:100%; justify-content:space-between;"><span class="muted">Wins (returns)</span><b>${fmt(wins)}</b></div>`);
    lines.push(`<div class="pill" style="width:100%; justify-content:space-between;"><span class="muted">Withdrawals / payouts</span><b>${fmt(wds)}</b></div>`);

    lines.push(`<div style="margin-top:10px" class="mini muted">Pending bets: <b>${pending.length}</b> • Pending stake: <b>${fmt(pendingStake)}</b> • Won: <b>${wonCount}</b> • Lost: <b>${lostCount}</b></div>`);

    lines.push(`<div style="margin-top:10px" class="mini muted">Deposits by member (only when you select a member on deposit):</div>`);
    const memLines = state.members.map(m => {
      const v = perMember[m] || 0;
      return `<div class="pill" style="width:100%; justify-content:space-between;"><span>${escapeHtml(m)}</span><b>${fmt(v)}</b></div>`;
    });
    lines.push(memLines.join(""));

    $("summary").innerHTML = lines.join("");
  }

  // --- odds + projected UI ---
  function updateBetFieldsVisibility() {
    const isBet = $("type").value === "bet";
    // We used two wrappers in HTML
    const oddsWrap = $("oddsWrap");
    const projWrap = $("projWrap");
    if (!oddsWrap || !projWrap) return;

    oddsWrap.style.display = isBet ? "block" : "none";
    projWrap.style.display = isBet ? "block" : "none";
    if (!isBet) {
      $("odds").value = "";
      $("projected").value = fmt(0);
    }
  }

  function updateProjected() {
    if ($("type").value !== "bet") return;
    const stake = parseAmount($("amount").value) || 0;
    const odds = parseAmount($("odds").value) || 0;
    const projected = stake > 0 && odds > 0 ? stake * odds : 0;
    $("projected").value = fmt(projected);
  }

  // --- handlers ---
  $("btnAdd").addEventListener("click", () => {
    const type = $("type").value;
    const date = $("date").value || todayISO();
    const amount = parseAmount($("amount").value);
    const member = $("member").value || "";
    const notes = $("notes").value || "";

    if (type === "bet") {
      const stake = amount;
      const odds = parseAmount($("odds").value);
      if (!stake) return alert("Enter a valid stake > 0");
      if (!odds) return alert("Enter valid decimal odds (e.g. 2.80)");

      const projected = stake * odds;
      const betId = uid();

      // 1) store bet as pending
      state.bets.push({
        id: betId,
        status: "pending",
        date,
        stake,
        odds,
        projected,
        member,
        notes
      });

      // 2) add ledger entry for stake outflow (reduces balance)
      state.tx.push({
        id: uid(),
        type: "bet",
        date,
        amount: stake,
        member,
        notes: `PENDING bet: ${notes || ""} (odds ${odds.toFixed(2)}, return ${fmt(projected)})`
      });

      save();
      $("amount").value = "";
      $("odds").value = "";
      $("notes").value = "";
      $("member").value = "";
      $("projected").value = fmt(0);
      renderAll();
      return;
    }

    // normal transaction flow
    if (!amount) return alert("Enter a valid amount > 0");

    state.tx.push({ id: uid(), type, date, amount, member, notes });
    save();

    $("amount").value = "";
    $("notes").value = "";
    $("member").value = "";

    renderAll();
  });

  $("btnAddMember").addEventListener("click", () => {
    const name = ($("newMember").value || "").trim();
    if (!name) return;
    if (state.members.includes(name)) return alert("That member already exists.");
    state.members.push(name);
    $("newMember").value = "";
    save();
    renderAll();
  });

  $("btnAddWeekly").addEventListener("click", () => {
    const amt = parseAmount($("weeklyDefault").value);
    if (!amt) return alert("Set a valid weekly default amount first.");
    const date = $("date").value || todayISO();

    state.weeklyDefault = amt;
    state.members.forEach(m => {
      state.tx.push({
        id: uid(),
        type: "deposit",
        date,
        amount: amt,
        member: m,
        notes: "Weekly contribution"
      });
    });
    save();
    renderAll();
  });

  $("weeklyDefault").addEventListener("change", () => {
    const amt = parseAmount($("weeklyDefault").value);
    if (amt) { state.weeklyDefault = amt; save(); }
  });

  $("search").addEventListener("input", renderLedger);
  $("filterType").addEventListener("change", renderLedger);

  $("type").addEventListener("change", () => {
    updateBetFieldsVisibility();
    updateProjected();
  });

  $("amount").addEventListener("input", updateProjected);
  $("odds").addEventListener("input", updateProjected);

  $("btnExport").addEventListener("click", () => {
    const rows = computeRunning();
    const header = ["date","type","member","notes","raw_amount","signed_amount","running_balance"];
    const csvCell = (v) => {
      const s = String(v ?? "");
      const escaped = s.replaceAll('"', '""');
      return /[,"\n]/.test(escaped) ? `"${escaped}"` : escaped;
    };

    const csv = [
      header.join(","),
      ...rows.map(r => {
        const signed = signedAmount(r);
        return [
          csvCell(r.date || ""),
          csvCell(r.type || ""),
          csvCell(r.member || ""),
          csvCell(r.notes || ""),
          csvCell(Number(r.amount||0)),
          csvCell(signed),
          csvCell(Number(r.running||0))
        ].join(",");
      })
    ].join("\n");

    downloadText(`punters_club_ledger_${todayISO()}.csv`, csv, "text/csv");
  });

  $("btnBackup").addEventListener("click", () => {
    downloadText(`punters_club_backup_${todayISO()}.json`, JSON.stringify(state, null, 2), "application/json");
  });

  $("btnRestore").addEventListener("click", () => $("fileRestore").click());

  $("fileRestore").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const obj = JSON.parse(text);
      if (!obj || !Array.isArray(obj.members) || !Array.isArray(obj.tx)) throw new Error("Invalid backup format.");
      state.members = obj.members;
      state.tx = obj.tx;
      state.weeklyDefault = obj.weeklyDefault ?? 25;
      state.bets = Array.isArray(obj.bets) ? obj.bets : [];
      save();
      $("weeklyDefault").value = state.weeklyDefault;
      renderAll();
      alert("Restore successful ✅");
    } catch (err) {
      alert("Restore failed: " + err.message);
    } finally {
      e.target.value = "";
    }
  });

  $("btnReset").addEventListener("click", () => {
    if (!confirm("Reset everything? This wipes members + ledger.")) return;
    localStorage.removeItem(KEY);
    localStorage.removeItem("punters_club_tracker_v1");
    location.reload();
  });

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function renderAll() {
    rebuildMemberSelect();
    renderMembers();
    renderLedger();
    renderPendingBets();
    renderSummary();
    updateBetFieldsVisibility();
    updateProjected();
  }

  renderAll();
})();
</script>
